name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: basedpyright
        run: basedpyright
      - name: pytest
        run: pytest
      - name: Shell script syntax
        run: bash -n deployment/oci/bootstrap.sh deployment/oci/remotobrowser-egress-filter.sh
      - name: pip-audit
        run: pip-audit --skip-editable

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate AMD64 and ARM64 builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build AMD64 image for security scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: remotobrowser:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: remotobrowser:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: "0"
      - name: Enforce Trivy vulnerability policy
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("trivy-results.json").read_text(encoding="utf-8"))
          findings = []
          for result in report.get("Results") or []:
              for vulnerability in result.get("Vulnerabilities") or []:
                  if vulnerability.get("Severity") in {"CRITICAL", "HIGH"}:
                      findings.append({
                          "target": result.get("Target"),
                          "type": result.get("Type"),
                          "vulnerability": vulnerability,
                      })

          for finding in findings:
              print(json.dumps(finding, ensure_ascii=False, indent=2))

          print(f"High/Critical vulnerabilities: {len(findings)}")
          sys.exit(1 if findings else 0)
          PY

  ci-success:
    needs: [quality, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed. Deployment is manual (see docs/deployment.md)."
