name: Deploy to OCI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: basedpyright
      - run: pytest

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/oarikui/remotobrowser:${{ github.sha }}
            ghcr.io/oarikui/remotobrowser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image on OCI VM
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE: ghcr.io/oarikui/remotobrowser:${{ github.sha }}
          REMOTE_DIR: ${{ vars.OCI_DEPLOY_PATH || '/opt/remotobrowser' }}
        run: |
          set -Eeuo pipefail
          test -n "$OCI_HOST"
          test -n "$OCI_USER"
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/oci_deploy_key -o BatchMode=yes "$OCI_USER@$OCI_HOST" \
            bash -s -- "$REMOTE_DIR" "$DEPLOY_BRANCH" "$DEPLOY_SHA" "$IMAGE" <<'REMOTE'
          set -Eeuo pipefail
          remote_dir="$1"
          deploy_branch="$2"
          deploy_sha="$3"
          image="$4"
          cd "$remote_dir"
          git fetch origin "$deploy_branch"
          git reset --hard "$deploy_sha"
          APP_IMAGE="$image" docker compose --env-file .env -f deployment/compose.oci.yaml pull app
          APP_IMAGE="$image" docker compose --env-file .env -f deployment/compose.oci.yaml up -d --remove-orphans
          REMOTE
